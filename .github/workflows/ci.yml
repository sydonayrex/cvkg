name: CVKG CI

on:
  # CI is manual-only: run explicitly via workflow_dispatch in the Actions tab.
  # Push/PR triggers are intentionally disabled.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Check, Test, Clippy, Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
          libjavascriptcoregtk-4.1-dev libspeechd-dev \
          libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
          libasound2-dev libfontconfig1-dev libssl-dev

    - name: Setup Rust toolchain (stable)
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-ci-

    - name: cargo check --workspace
      run: cargo check --workspace

    - name: cargo test --workspace
      run: cargo test --workspace --tests --lib --bins

    - name: cargo clippy --workspace --all-targets -- -D warnings
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: cargo fmt -- --check
      run: cargo fmt -- --check

    - name: Verify COMPONENTS.md is up-to-date
      run: |
        if [ -f tools/gen_component_index.py ]; then
          ./tools/gen_component_index.py > /tmp/expected_components.md
          if ! diff -q COMPONENTS.md /tmp/expected_components.md > /dev/null; then
            echo "COMPONENTS.md is out of date. Run 'tools/gen_component_index.py > COMPONENTS.md' to update."
            exit 1
          fi
        fi

  # P0-3: composed WGSL validation for native + wasm shader sets.
  shader-validation:
    name: Composed WGSL validation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check wasm shader variants are in sync
      run: python3 scripts/validate_shaders.py --check

    - name: Setup Rust toolchain (stable)
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-shaders-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-shaders-

    - name: Validate every composed shader variant with naga
      run: cargo test -p cvkg-render-gpu --lib shader_composition

  # P2-5: full wasm32 compile gate. Native-only crates (cli, webkit-server,
  # render-native, gallery, berserker) compile as empty stubs on wasm: their
  # dependencies are target-gated and their entry points dispatch to a no-op
  # wasm main. This proves the whole workspace is wasm-checkable, NOT that those
  # native apps are functional in a browser.
  wasm-build:
    name: wasm32 build (full workspace)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust toolchain (stable) + wasm target
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-wasm-

    - name: cargo check (full workspace)
      run: cargo check --workspace --target wasm32-unknown-unknown

  # P2-5: native desktop smoke gate. Installs the same Linux system deps as the main
  # ci job, builds a representative native binary (cvkg-gallery), and runs the
  # headless `trace_gallery` rendering-trace test plus the cvkg-render-native lib
  # suite (no window is opened). The earlier stale-test-fixture failure in that
  # suite was fixed, so both are now gated. This verifies the native build and the
  # headless render path only, not real GUI/window behaviour.
  desktop-smoke:
    name: Desktop native build + headless smoke
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
          libjavascriptcoregtk-4.1-dev libspeechd-dev \
          libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
          libasound2-dev libfontconfig1-dev libssl-dev

    - name: Setup Rust toolchain (stable)
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: ${{ runner.os }}-cargo-desktop-

    - name: Build native gallery binary
      run: cargo build -p cvkg-gallery

    - name: Run headless rendering smoke test (no window)
      run: cargo test -p cvkg-gallery --test trace_gallery

    - name: Native renderer unit tests
      run: cargo test -p cvkg-render-native --lib
