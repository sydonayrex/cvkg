[package]
name = "cvkg-spatial"
version = "0.3.4"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/sydonayrex/cvkg"
description = "CVKG spatial indexing — QuadTree, BVH, and SpatialHash for platform-wide use"

[lib]
name = "cvkg_spatial"
path = "src/lib.rs"

[[test]]
name = "frustum_tests"
path = "tests/frustum_tests.rs"

[dependencies]
cvkg-core = { workspace = true }
glam = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
