<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVKG OS - Grand Viking Longboaters</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark: #07070f;
            --cyan: #00ffff;
            --magenta: #ff00ff;
            --amber: #ffaa00;
            --glass-bg: rgba(5, 5, 20, 0.75);
            --glass-border: rgba(0, 255, 255, 0.3);
            --neon-glow: 0 0 8px;
            --gungnir: linear-gradient(90deg, transparent, #00ffff, #ff00ff, #00ffff, transparent);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--dark);
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            color: var(--cyan);
            position: relative;
            cursor: default;
        }

        /* Scanline overlay - Subtle */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 255, 255, 0.01) 0px,
                    rgba(0, 255, 255, 0.01) 1px,
                    transparent 1px,
                    transparent 2px);
            pointer-events: none;
            z-index: 9999;
        }

        /* Glassmorphism panel */
        .panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            border-radius: 12px;
        }

        .panel:hover {
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.2);
        }

        .panel.active {
            border-color: var(--cyan);
        }

        /* Desktop */
        #desktop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0a1f 0%, #07070f 100%);
            overflow: hidden;
        }

        /* Desktop icons */
        .desktop-icon {
            position: absolute;
            width: 90px;
            height: 100px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            padding: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 12px;
        }

        .desktop-icon:hover {
            background: rgba(0, 255, 255, 0.1);
            transform: translateY(-5px);
        }

        .desktop-icon.selected {
            background: rgba(0, 255, 255, 0.2);
            border: 1px solid var(--cyan);
        }

        .icon-img {
            width: 48px;
            height: 48px;
            margin: 0 auto 8px;
            background: rgba(30, 30, 45, 0.6);
            backdrop-filter: blur(5px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--cyan);
        }

        .icon-name {
            font-size: 11px;
            color: #fff;
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
            font-weight: 500;
        }

        /* Liquid Floating Dock */
        #dock-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 10px;
        }

        #dock {
            background: linear-gradient(135deg, rgba(30, 10, 5, 0.4), rgba(60, 20, 5, 0.4));
            backdrop-filter: blur(24px) saturate(200%);
            -webkit-backdrop-filter: blur(24px) saturate(200%);
            border: 1px solid rgba(255, 100, 0, 0.3);
            border-radius: 28px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.8),
                0 0 20px rgba(255, 60, 0, 0.2) inset;
            position: relative;
            overflow: hidden;
        }

        /* Circulating Hot Spots */
        #dock::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 100, 0, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(255, 200, 0, 0.2) 0%, transparent 50%);
            mix-blend-mode: color-dodge;
            animation: magma-move 8s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes magma-move {
            0% { transform: scale(1) translateX(-10%); opacity: 0.5; }
            50% { transform: scale(1.2) translateX(10%); opacity: 0.8; }
            100% { transform: scale(1) translateX(-10%); opacity: 0.5; }
        }

        /* Gungnir Glow Effect */
        #dock::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -100%;
            width: 200%;
            height: 2px;
            background: var(--gungnir);
            animation: gungnir-sweep 5s linear infinite;
            filter: blur(6px);
            opacity: 0.6;
        }

        @keyframes gungnir-sweep {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(50%);
            }
        }

        .dock-icon {
            width: 54px;
            height: 54px;
            background: rgba(20, 20, 35, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: var(--cyan);
            position: relative;
        }

        .dock-icon:hover {
            transform: translateY(-12px) scale(1.15);
            background: rgba(30, 30, 50, 0.9);
            border-color: var(--cyan);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .dock-icon svg {
            width: 28px;
            height: 28px;
            transition: all 0.3s;
        }

        .dock-icon:hover svg {
            filter: drop-shadow(0 0 8px var(--cyan));
        }

        /* Tooltip */
        .dock-icon::before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(10, 10, 20, 0.9);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            border: 1px solid var(--glass-border);
        }

        .dock-icon:hover::before {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Start Menu */
        #start-menu {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            width: 420px;
            height: 520px;
            background: rgba(10, 10, 20, 0.85);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            display: none;
            flex-direction: column;
            z-index: 1001;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #start-menu.active {
            display: flex;
            transform: translateX(-50%) translateY(0);
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 16px;
            border-radius: 16px;
            transition: all 0.3s;
        }

        .app-icon:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: scale(1.05);
        }

        .app-icon-img {
            width: 48px;
            height: 48px;
            background: rgba(30, 30, 45, 0.8);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-border);
        }

        /* Window */
        .window {
            position: absolute;
            background: rgba(10, 10, 20, 0.7);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            min-width: 400px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            animation: windowOpen 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes windowOpen {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .window-titlebar {
            height: 40px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            padding: 0 16px;
            cursor: move;
            user-select: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .window-title {
            flex: 1;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .window-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }

        .close-btn {
            background: #ff5f56;
        }

        .min-btn {
            background: #ffbd2e;
        }

        .max-btn {
            background: #27c93f;
        }

        .window-btn:hover {
            transform: scale(1.2);
            filter: brightness(1.2);
        }

        .window-content {
            flex: 1;
            color: #ccc;
            font-size: 14px;
            overflow: hidden;
            position: relative;
        }

        /* System Tray */
        #system-tray {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            background: rgba(10, 10, 20, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            z-index: 900;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tray-icon {
            color: var(--cyan);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #lightning-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            opacity: 0.25;
        }

        .shatter-fragment {
            position: fixed;
            width: 3px;
            height: 3px;
            background: var(--cyan);
            pointer-events: none;
            z-index: 9999;
            border-radius: 50%;
        }

        /* Circular Context Menu */
        #context-menu {
            position: fixed;
            width: 200px;
            height: 200px;
            display: none;
            z-index: 10000;
            pointer-events: none;
        }

        .menu-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            z-index: 2;
        }

        .menu-item {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(10, 10, 20, 0.95);
            border: 1px solid var(--cyan);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
            transform-origin: center;
            color: #fff;
        }

        .menu-item span {
            font-size: 8px;
            font-weight: bold;
            margin-top: 2px;
            text-transform: uppercase;
            pointer-events: none;
        }

        .menu-item:hover {
            background: var(--cyan);
            color: #000;
            transform: scale(1.15);
            box-shadow: 0 0 20px var(--cyan);
        }

        /* List Context Menu (Files) */
        #file-menu {
            position: fixed;
            width: 160px;
            background: rgba(10, 10, 20, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            display: none;
            z-index: 10001;
            padding: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .file-menu-item {
            padding: 8px 12px;
            color: #fff;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .file-menu-item:hover {
            background: rgba(0, 255, 255, 0.2);
            color: var(--cyan);
        }

        /* Wanted Warning */
        #wanted-warning {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 0, 0, 0.8);
            color: #fff;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 900;
            letter-spacing: 2px;
            display: none;
            animation: pulse 1s infinite alternate;
            z-index: 100;
        }

        @keyframes pulse {
            from { opacity: 0.5; transform: scale(1); }
            to { opacity: 1; transform: scale(1.05); }
        }
    </style>
</head>

<body>
    <div id="desktop" oncontextmenu="CVKG.showContextMenu(event)"></div>
    <canvas id="lightning-canvas"></canvas>
    <div id="context-menu">
        <div class="menu-center"></div>
        <div class="menu-item" style="transform: translate(-50%, -50%) translate(0, -75px)" onclick="CVKG.menuAction('New File')"><span>📄</span><span>New File</span></div>
        <div class="menu-item" style="transform: translate(-50%, -50%) translate(75px, 0)" onclick="CVKG.menuAction('New Folder')"><span>📁</span><span>Folder</span></div>
        <div class="menu-item" style="transform: translate(-50%, -50%) translate(0, 75px)" onclick="CVKG.menuAction('Refresh')"><span>🔄</span><span>Refresh</span></div>
        <div class="menu-item" style="transform: translate(-50%, -50%) translate(-75px, 0)" onclick="CVKG.menuAction('Settings')"><span>⚙️</span><span>Settings</span></div>
    </div>

    <div id="file-menu">
        <div class="file-menu-item" onclick="CVKG.fileAction('Rename')">✏️ Rename</div>
        <div class="file-menu-item" onclick="CVKG.fileAction('Copy')">📋 Copy</div>
        <div class="file-menu-item" onclick="CVKG.fileAction('Move')">📦 Move</div>
        <div class="file-menu-item" onclick="CVKG.fileAction('Delete')" style="color:#ff5f56;">🗑️ Delete</div>
        <div class="file-menu-item" onclick="CVKG.fileAction('Properties')">ℹ️ Info</div>
    </div>

    <div id="system-tray">
        <div class="tray-icon" title="Network: Connected">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M5 12.55a11 11 0 0 1 14.08 0" />
                <path d="M1.42 9a16 16 0 0 1 21.16 0" />
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
                <line x1="12" y1="20" x2="12" y2="20" />
            </svg>
        </div>
        <div id="system-tray-time">--:--:--</div>
    </div>

    <div id="start-menu" class="panel">
        <h2 style="margin-bottom: 24px; font-size: 18px; color: #fff;">Applications</h2>
        <div class="app-grid">
            <div class="app-icon" onclick="CVKG.openApp('filemanager')">
                <div class="app-icon-img">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
                    </svg>
                </div>
                <div class="icon-name">Explorer</div>
            </div>
            <div class="app-icon" onclick="CVKG.openApp('vikinggta')">
                <div class="app-icon-img">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <circle cx="12" cy="12" r="3" />
                        <path d="M12 2v20M2 12h20" />
                    </svg>
                </div>
                <div class="icon-name">Grand Viking Longboaters</div>
            </div>
            <div class="app-icon" onclick="CVKG.openApp('terminal')">
                <div class="app-icon-img">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="4 17 10 11 4 5" />
                        <line x1="12" y1="19" x2="20" y2="19" />
                    </svg>
                </div>
                <div class="icon-name">Terminal</div>
            </div>
            <div class="app-icon" onclick="CVKG.openApp('settings')">
                <div class="app-icon-img">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3" />
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </svg>
                </div>
                <div class="icon-name">Settings</div>
            </div>
            <div class="app-icon" onclick="CVKG.openApp('browser')">
                <div class="app-icon-img">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="2" y1="12" x2="22" y2="12" />
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
                    </svg>
                </div>
                <div class="icon-name">Web Browser</div>
            </div>
            <div class="app-icon" onclick="CVKG.openApp('editor')">
                <div class="app-icon-img">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                    </svg>
                </div>
                <div class="icon-name">Text Editor</div>
            </div>
            <div class="app-icon" onclick="CVKG.openApp('imageviewer')">
                <div class="app-icon-img">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                        <circle cx="8.5" cy="8.5" r="1.5" />
                        <polyline points="21 15 16 10 5 21" />
                    </svg>
                </div>
                <div class="icon-name">Image Viewer</div>
            </div>
        </div>
    </div>

    <!-- Liquid Floating Dock -->
    <div id="dock-container">
        <div id="dock">
            <div class="dock-icon" data-tooltip="Start Menu" onclick="CVKG.toggleStartMenu()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" />
                    <path d="M12 22V12" />
                    <path d="M12 12l9-5M12 12L3 7" />
                </svg>
            </div>
            <div class="dock-icon" data-tooltip="File Manager" onclick="CVKG.openApp('filemanager')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
                </svg>
            </div>
            <div class="dock-icon" data-tooltip="Grand Viking Longboaters" onclick="CVKG.openApp('vikinggta')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <circle cx="12" cy="12" r="3" />
                    <line x1="12" y1="2" x2="12" y2="22" />
                    <line x1="2" y1="12" x2="22" y2="12" />
                    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
                    <line x1="4.93" y1="19.07" x2="19.07" y2="4.93" />
                </svg>
            </div>
            <div class="dock-icon" data-tooltip="Terminal" onclick="CVKG.openApp('terminal')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="4 17 10 11 4 5" />
                    <line x1="12" y1="19" x2="20" y2="19" />
                </svg>
            </div>
        </div>
    </div>

    <script src="/cvkg-webkit-server/static/three.min.js"></script>
    <script src="/cvkg-webkit-server/static/cvkg-os.js"></script>
</body>

</html>
