<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niflheim Web Demo - WGPU</title>
    <style>
        :root {
            --glass-bg: rgba(15, 20, 35, 0.4);
            --glass-border: rgba(0, 242, 255, 0.3);
            --accent: #00f2ff;
            --accent-dim: rgba(0, 242, 255, 0.15);
            --fire-orange: #ff6b35;
            --fire-yellow: #ffd23f;
            --fire-white: #fff176;
            --lightning-blue: #00f2ff;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(ellipse at center, #020205 0%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            position: relative;
        }
        
        /* Glassmorphism container */
        #cvkg-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }
        
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        #status {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #00FFFF;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }
        
        /* Fireball overlay canvas */
        #fireball-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="status">DIAGNOSTIC BOOT ACTIVE...</div>
    <canvas id="fireball-canvas"></canvas>
    <div id="cvkg-root">
        <div id="cvkg-container">
            <canvas id="cvkg-canvas"></canvas>
        </div>
    </div>
    <script type="module" src="/cvkg-webkit-server/static/niflheim.js"></script>
</body>
</html>
