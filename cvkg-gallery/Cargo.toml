[package]
name = "cvkg-gallery"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cvkg-gallery"
path = "src/main.rs"

[lib]
name = "cvkg_gallery"
path = "src/lib.rs"

[dependencies]
cvkg = { workspace = true, features = ["native"] }
cvkg-components = { workspace = true }
cvkg-core = { workspace = true }
stacker = "0.1"
libc = "0.2"
chrono = "0.4"
urlencoding = "2.1"

[dev-dependencies]
cvkg-render-software = { workspace = true }
cvkg-runic-text = { workspace = true }
cvkg-vdom = { workspace = true }
glam = { workspace = true }

[[test]]
name = "trace_gallery"
path = "tests/trace_gallery.rs"
